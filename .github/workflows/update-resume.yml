name: Update Resume from Overleaf

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 8:00 AM UTC
  workflow_dispatch:        # Also triggerable manually from the Actions tab

permissions:
  contents: write           # Needed to commit and push the updated PDF

jobs:
  update-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            latexmk

      - name: Clone Overleaf project
        env:
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
          OVERLEAF_GIT_TOKEN:  ${{ secrets.OVERLEAF_GIT_TOKEN }}
        run: |
          git clone "https://git:$OVERLEAF_GIT_TOKEN@git.overleaf.com/$OVERLEAF_PROJECT_ID" overleaf_project

      - name: Compile PDF
        run: |
          cd overleaf_project
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Copy PDF to resources
        run: |
          mkdir -p resources
          cp overleaf_project/main.pdf resources/Resume.pdf

      - name: Commit and push if PDF changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/Resume.pdf
          git diff --staged --quiet \
            && echo "No changes to resume — skipping commit." \
            || (git commit -m "chore: update resume from Overleaf" && git push)