name: Update Resume from Overleaf
 
on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 8:00 AM UTC
  workflow_dispatch:        # Also triggerable manually from the Actions tab
 
permissions:
  contents: write           # Needed to commit and push the updated PDF
 
jobs:
  update-resume:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install requests
 
      - name: Download resume PDF from Overleaf
        env:
          OVERLEAF_EMAIL:      ${{ secrets.OVERLEAF_EMAIL }}
          OVERLEAF_PASSWORD:   ${{ secrets.OVERLEAF_PASSWORD }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
        run: python scripts/download_resume.py
 
      - name: Commit and push if PDF changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/Resume.pdf
          git diff --staged --quiet \
            && echo "No changes to resume — skipping commit." \
            || (git commit -m "chore: update resume from Overleaf" && git push)